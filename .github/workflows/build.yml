name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          set -e
          echo "=== Finding Android Project Root ==="
          
          # Tìm thư mục chứa settings.gradle hoặc build.gradle
          GRADLE_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1))

          echo "Project directory found: $GRADLE_DIR"
          cd "$GRADLE_DIR"

          gradle --version
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToogleWords-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
